name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Test
        run: go test -tags sqlite_fts5 ./...
      - name: Race test
        run: go test -race -tags sqlite_fts5 ./...
      - name: Staticcheck
        run: GOWORK=off go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags sqlite_fts5 ./...
      - name: Vulnerability scan
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags sqlite_fts5 ./...
      - name: Release contract
        run: go run ./cmd/release-tool check --json
      - name: Built-in demo
        run: go run -tags sqlite_fts5 . demo --json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-matrix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build -tags sqlite_fts5 ./...
      - name: Test
        run: go test -tags sqlite_fts5 ./...
      - name: Isolated demo
        run: go run -tags sqlite_fts5 . demo --json

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install
        run: npm ci --prefix vscode-extension
      - name: Type-check and audit
        run: |
          npm run check --prefix vscode-extension
          npm test --prefix vscode-extension
          npm audit --prefix vscode-extension --audit-level=high
      - name: Package VSIX
        run: |
          npm run package --prefix vscode-extension
          npm run package --prefix vscode-extension
      - name: Upload VSIX proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-puller-search-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
          archive: false
