name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
      - name: Test
        run: go test -tags sqlite_fts5 ./...
      - name: Race test
        run: go test -race -tags sqlite_fts5 ./...
      - name: Staticcheck
        run: GOWORK=off go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags sqlite_fts5 ./...
      - name: Vulnerability scan
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags sqlite_fts5 ./...
      - name: Release contract
        run: go run ./cmd/release-tool check --json
      - name: Built-in demo
        run: go run -tags sqlite_fts5 . demo --json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-matrix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build -tags sqlite_fts5 ./...
      - name: Test
        run: go test -tags sqlite_fts5 ./...
      - name: Isolated demo
        run: go run -tags sqlite_fts5 . demo --json

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install
        run: npm ci --prefix vscode-extension
      - name: Type-check and audit
        run: |
          npm run check --prefix vscode-extension
          npm test --prefix vscode-extension
          npm audit --prefix vscode-extension --audit-level=high
      - name: Package VSIX
        run: |
          npm run package --prefix vscode-extension
          npm run package --prefix vscode-extension
      - name: Upload VSIX proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-puller-search-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
          archive: false

  public-demo:
    name: public demo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.15.1
      - name: Verify public demo
        run: |
          pnpm --dir site install --frozen-lockfile
          pnpm --dir site run check
          pnpm --dir site audit --audit-level high
          pnpm --dir site run deploy:dry-run
      - name: Verify browser journeys
        run: |
          pnpm --dir site exec playwright install --with-deps chromium
          pnpm --dir site run test:e2e
      - name: Build and verify the locked public corpus
        env:
          DOCS_PULLER_QUERY_LOG: '0'
        run: |
          mkdir -p "${RUNNER_TEMP}/demo-bin"
          version="$(jq -r .version release/manifest.json)"
          ldflags="-s -w -buildid= -X main.releaseIdentity=docs-puller-release:${version}@${GITHUB_SHA}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -tags sqlite_fts5 -trimpath -buildvcs=false -ldflags "$ldflags" -o "${RUNNER_TEMP}/demo-bin/docs-puller-a" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -tags sqlite_fts5 -trimpath -buildvcs=false -ldflags "$ldflags" -o "${RUNNER_TEMP}/demo-bin/docs-puller-b" .
          cmp "${RUNNER_TEMP}/demo-bin/docs-puller-a" "${RUNNER_TEMP}/demo-bin/docs-puller-b"
          go build -mod=readonly -tags sqlite_fts5 -trimpath -buildvcs=false -o "${RUNNER_TEMP}/demo-bin/docs-puller-host" .
          "${RUNNER_TEMP}/demo-bin/docs-puller-host" pull --from eval/sample-corpus/sources.md --out "${RUNNER_TEMP}/demo-corpus"
          "${RUNNER_TEMP}/demo-bin/docs-puller-host" reindex --out "${RUNNER_TEMP}/demo-corpus"
          "${RUNNER_TEMP}/demo-bin/docs-puller-host" status --out "${RUNNER_TEMP}/demo-corpus" --check
          "${RUNNER_TEMP}/demo-bin/docs-puller-host" eval \
            --fixture eval/sample-corpus/fixture.yaml \
            --out "${RUNNER_TEMP}/demo-corpus" \
            --json --min-hit-at-1 0.90 --min-hit-at-5 1.0 --min-mrr 0.95 --max-p99-ms 250 | tee demo-eval.json
          go run -tags sqlite_fts5 ./deploy/demo/cmd/corpus-builder \
            --corpus "${RUNNER_TEMP}/demo-corpus" \
            --binary "${RUNNER_TEMP}/demo-bin/docs-puller-a" \
            --build-context deploy/demo/.build | tee demo-build.json
      - name: Prove the container image is reproducible
        run: |
          source_date_epoch="$(jq -r .source_date_epoch deploy/demo/corpus.lock.json)"
          docker buildx build --load --no-cache --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --provenance=false --sbom=false \
            --metadata-file "${RUNNER_TEMP}/demo-image-a.json" \
            --tag docs-puller-demo-origin:ci-a deploy/demo/.build
          docker buildx build --load --no-cache --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --provenance=false --sbom=false \
            --metadata-file "${RUNNER_TEMP}/demo-image-b.json" \
            --tag docs-puller-demo-origin:ci-b deploy/demo/.build
          manifest_a="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/demo-image-a.json")"
          manifest_b="$(jq -er '."containerimage.digest"' "${RUNNER_TEMP}/demo-image-b.json")"
          layers_a="$(docker image inspect docs-puller-demo-origin:ci-a --format '{{json .RootFS.Layers}}')"
          layers_b="$(docker image inspect docs-puller-demo-origin:ci-b --format '{{json .RootFS.Layers}}')"
          test "$manifest_a" = "$manifest_b"
          test "$layers_a" = "$layers_b"
          test "$(docker image inspect docs-puller-demo-origin:ci-a --format '{{.Config.User}}')" = '65532:65532'
          jq -n \
            --arg manifest_digest "$manifest_a" \
            --argjson rootfs_layers "$layers_a" \
            '{ok:true, manifest_digest:$manifest_digest, rootfs_layers:$rootfs_layers, user:"65532:65532"}' \
            > demo-image-reproducibility.json
      - name: Scan actionable image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docs-puller-demo-origin:ci-a
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docs-puller-demo-origin:ci-a
          format: spdx-json
          output-file: demo-origin.spdx.json
          upload-artifact: false
      - name: Upload public demo evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-demo-${{ github.run_id }}
          path: |
            demo-build.json
            demo-eval.json
            demo-image-reproducibility.json
            demo-origin.spdx.json
            deploy/demo/.build/build-manifest.json
            site/playwright-report/
            site/test-results/
          if-no-files-found: warn
