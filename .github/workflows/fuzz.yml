name: fuzz

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.fuzzer }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - fuzzer: FuzzDedupeLocaleVariants
            package: .
          - fuzzer: FuzzManifestParse
            package: .
          - fuzzer: FuzzFtsBuildQuery
            package: .
          - fuzzer: FuzzConfigParse
            package: ./internal/userconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz for two minutes
        run: go test -tags sqlite_fts5 -run '^$' -fuzz '^${{ matrix.fuzzer }}$' -fuzztime 2m '${{ matrix.package }}'
      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.fuzzer }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
