name: public sample replay

on:
  schedule:
    - cron: '43 8 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: public-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build -tags sqlite_fts5 -o bin/docs-puller .
      - name: Pull public sample
        run: bin/docs-puller pull --from eval/sample-corpus/sources.md --out "${RUNNER_TEMP}/public-sample"
      - name: Reindex and verify corpus
        run: |
          bin/docs-puller reindex --out "${RUNNER_TEMP}/public-sample"
          bin/docs-puller status --out "${RUNNER_TEMP}/public-sample" --check
      - name: Enforce published retrieval floor
        id: evaluation
        continue-on-error: true
        run: |
          set -o pipefail
          bin/docs-puller eval \
            --fixture eval/sample-corpus/fixture.yaml \
            --out "${RUNNER_TEMP}/public-sample" \
            --json \
            --min-hit-at-1 0.90 \
            --min-hit-at-5 1.0 \
            --min-mrr 0.95 \
            --max-p99-ms 250 | tee public-sample-result.json
      - name: Verify reviewed production corpus lock
        id: lock
        continue-on-error: true
        run: |
          set -o pipefail
          go run -tags sqlite_fts5 ./deploy/demo/cmd/corpus-builder \
            --corpus "${RUNNER_TEMP}/public-sample" | tee corpus-lock-verification.json
      - name: Summarize metrics
        if: always()
        run: test ! -f public-sample-result.json || jq '.summary' public-sample-result.json
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-sample-${{ github.run_id }}
          path: |
            public-sample-result.json
            corpus-lock-verification.json
          if-no-files-found: ignore
      - name: Manage upstream drift issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
          LOCK_OUTCOME: ${{ steps.lock.outcome }}
        with:
          script: |
            const title = "docs-puller public sample replay needs review";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const openIssue = issues.find((issue) => issue.title === title);
            const ok = process.env.EVALUATION_OUTCOME === "success" &&
              process.env.LOCK_OUTCOME === "success";

            if (ok) {
              if (openIssue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: openIssue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }
            if (openIssue) return;

            const runURL = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: [
                "The weekly live replay no longer matches the reviewed production snapshot or its retrieval floor.",
                "",
                `Run: ${runURL}`,
                `Evaluation: ${process.env.EVALUATION_OUTCOME}`,
                `Content lock: ${process.env.LOCK_OUTCOME}`,
                "",
                "Production still uses the frozen, reviewed snapshot. Inspect the upstream diff, license status, and retrieval metrics before changing the lock or deploying new bytes.",
                "Use deploy/demo/CORPUS.md for the review procedure.",
              ].join("\n"),
            });
      - name: Mark the replay run failed
        if: steps.evaluation.outcome == 'failure' || steps.lock.outcome == 'failure'
        run: exit 1
