schema_version: 2
product_id: product.docs-puller
visibility: public
reviewed: true
presentation:
    summary: Local-first documentation retrieval with measurable search quality.
    detail: Mirror documentation to Markdown, index it with SQLite FTS5, and compare deterministic or optional AI-assisted ranking from one Go CLI.
    language: Go
    lane: Retrieval and developer tooling
    metric:
        label: public live-page BM25 sample
        value: 95.8% Hit@1 · 100% Hit@5
        evidence_url: https://github.com/nstranquist/docs-puller#measured-retrieval
access:
    profile: go-cli
    primary_action:
        kind: try
        label: Try the live demo
        url: https://docs-puller-demo.nstranquist.workers.dev
    repository_url: https://github.com/nstranquist/docs-puller
    documentation_url: https://github.com/nstranquist/docs-puller#quick-start
    demo_url: https://docs-puller-demo.nstranquist.workers.dev
    feedback_url: https://github.com/nstranquist/docs-puller/issues/new
    module: github.com/nstranquist/docs-puller
    binary: docs-puller
    smoke_argv: [go, run, ., --help]
proof:
    claims:
        - id: measured-retrieval
          statement: The repository publishes deterministic retrieval evaluation results and the commands that reproduce them.
          evidence_kind: test
          evidence_url: https://github.com/nstranquist/docs-puller#measured-retrieval
        - id: local-search
          statement: The CLI can pull, index, and search a local documentation corpus with SQLite FTS5.
          evidence_kind: documentation
          evidence_url: https://github.com/nstranquist/docs-puller#five-minute-smoke
        - id: engineering-case-study
          statement: The public case study documents the architecture, measured results, release discipline, and claim boundaries.
          evidence_kind: documentation
          evidence_url: https://github.com/nstranquist/docs-puller/blob/main/CASE_STUDY.md
        - id: public-live-demo
          statement: The public demo searches the reviewed sample corpus through the same Go and SQLite FTS5 engine as the CLI.
          evidence_kind: demo
          evidence_url: https://docs-puller-demo.nstranquist.workers.dev
    boundaries:
        - Optional reranking and embeddings need separately configured model providers.
        - Public source, releases, deployment health, and synthetic checks do not prove external adoption.
assets:
    - path: portfolio/assets/search-results.png
      kind: screenshot
      alt: docs-puller web search showing ranked SQLite documentation results
      caption: A real local FTS5 search for sqlite across 47,924 ingested documents.
      public: true
      provenance: local-synthetic-fixture-capture
      copyright_owner: Nico Stranquist
    - path: screenshots/landing.png
      kind: screenshot
      alt: docs-puller landing page with local corpus counts
      caption: Empty-state landing. Corpus counts only; no filesystem root.
      public: true
      provenance: local-synthetic-fixture-capture
      copyright_owner: Nico Stranquist
    - path: assets/brand/docs-puller.svg
      kind: logo
      alt: docs-puller application icon
      provenance: authored-svg
      copyright_owner: Nico Stranquist
      generator: catalog-brand-svg/v2
      concept: docs-retrieval
      score: 100
case_study:
    enabled: true
    summary: A local-first Go retrieval system with frozen evaluations, secure serving, and reproducible release artifacts.
    evidence:
        - portfolio/assets/search-results.png
        - screenshots/landing.png
        - assets/brand/docs-puller.svg
