# Final independent retrieval audit for docs-puller v0.6.
#
# These 35 privacy-safe questions cover public documentation concepts that do
# not occur in the earlier v0.6 tuning corpora. Every query uses an explicit
# source, which is the contract for the source-scoped semantic lexical tier.
# This file was committed before its first ranked evaluation. The first result
# is immutable release evidence; do not tune v0.6 against this fixture.

query_type: privacy_safe_final_independent_holdout_v4

