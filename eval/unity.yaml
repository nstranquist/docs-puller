# Retrieval acceptance for the official Unity Manual + package/CLI corpus.
# Every query is source-scoped. Paths are relative to ~/code/docs and must
# exist after a unity pull (verified via --check-fixture).

query_type: library_search

queries:
  # Unity CLI (native Markdown mirrors on docs.unity.com)
  - q: Unity CLI standalone command line tool manage Editors modules
    source: unity
    expect:
      - unity/en-us/unity-cli/unity-cli.md

  - q: install Unity CLI with Homebrew or winget
    source: unity
    expect:
      - unity/en-us/unity-cli/use-unity-cli.md

  - q: Unity CLI command options output formats and exit codes
    source: unity
    expect:
      - unity/en-us/unity-cli/unity-cli-reference.md

  - q: Unity CLI release notes improvements fixes
    source: unity
    expect:
      - unity/en-us/unity-cli/release-notes.md

  # Fundamentals
  - q: GameObject introduction components
    source: unity
    expect:
      - unity/Manual/GameObjects.md

  - q: The GameObject class
    source: unity
    expect:
      - unity/Manual/class-GameObject.md

  - q: Creating and Using Scripts MonoBehaviour
    source: unity
    expect:
      - unity/Manual/CreatingAndUsingScripts.md

  - q: Event Functions Update FixedUpdate
    source: unity
    expect:
      - unity/Manual/EventFunctions.md

  - q: Prefabs instantiate
    source: unity
    expect:
      - unity/Manual/Prefabs.md
      - unity/Manual/InstantiatingPrefabs.md

  - q: Execution Order of event functions
    source: unity
    expect:
      - unity/Manual/ExecutionOrder.md

