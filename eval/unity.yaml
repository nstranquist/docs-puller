  - q: Box Collider 2D
    source: unity
    expect:
      - unity/Manual/class-BoxCollider2D.md

  - q: Rigidbody 2D introduction
    source: unity
    expect:
      - unity/Manual/class-Rigidbody2D.md

  - q: Box collider component reference
    source: unity
    expect:
      - unity/Manual/class-BoxCollider.md

  # Input / UI
  - q: Input Manager legacy input
    source: unity
    expect:
      - unity/Manual/Input.md

  - q: UI Toolkit introduction
    source: unity
    expect:
      - unity/Manual/UIElements.md

  - q: Get started with runtime UI
    source: unity
    expect:
      - unity/Manual/UIE-get-started-with-runtime-ui.md

  - q: Support for runtime UI Toolkit
    source: unity
    expect:
      - unity/Manual/UIE-support-for-runtime-ui.md

  - q: 2D game development
    source: unity
    expect:
      - unity/Manual/Unity2D.md

  # Build / CLI / testing
  - q: Unity Editor command line arguments batchmode
    source: unity
    expect:
      - unity/Manual/EditorCommandLineArguments.md

  - q: Command-line arguments interface
    source: unity
    expect:
      - unity/Manual/CommandLineArguments.md

  - q: WebGL building Web Build folder
    source: unity
    expect:
      - unity/Manual/webgl-building.md

  - q: Web development publishing process
    source: unity
    expect:
      - unity/Manual/webgl-gettingstarted.md

  - q: class PlayerSettings
    source: unity
    expect:
      - unity/Manual/class-PlayerSettings.md

  - q: com.unity.test-framework package manual
    source: unity
